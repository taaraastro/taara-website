name: Daily rashifal pages
on:
  schedule:
    - cron: "35 18 * * *"   # 00:05 IST every day
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate today's and tomorrow's pages
        run: node tools/generate.js --days 2 --out docs
      - name: Commit new pages
        run: |
          git config user.name "taara-bot"
          git config user.email "taara-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Rashifal pages for $(TZ=Asia/Kolkata date +%F)"
          git push
